<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000">
  <defs>
    <linearGradient id="linear-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.51" stop-color="#cbd5e1" />
      <stop offset="0.53" stop-color="#94a3b8" />
    </linearGradient>
    <style>
      #Hills { transform-origin: 996px 996px; animation: rotate 120s infinite linear; }
      #Road { transform-origin: 996px 996px; animation: rotate 30s infinite linear; }
      #Foreground { transform-origin: 996px 996px; animation: rotate 15s infinite linear; }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      .hills { fill: #bbf7d0; }
      .ground { fill: #86efac; }
      .road { stroke: #334155; stroke-width: 33px; fill: none; stroke-miterlimit: 10; }
      .road-lines { stroke: #ffffff; stroke-width: 4px; stroke-dasharray: 9 10; stroke-miterlimit: 10; fill: none; }
      .trunk { fill: #78716c; }
      .tree { fill: #22c55e; }
      .light-tree { fill: #4ade80; }
      .car { fill: #ff0000; }
      .car-window { fill: #f3e8ff; }
      .wheels { fill: url(#linear-gradient); }
      .wheel-rim { fill: #f8fafc; }
    </style>
  </defs>

